version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fva-identity-postgres
    environment:
      POSTGRES_DB: fva_identity
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d fva_identity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: fva-identity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fva-identity-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=identity_access.settings.development
      - DATABASE_NAME=fva_identity
      - DATABASE_USER=app_user
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-devpassword}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fva-identity-celery-worker
    command: celery -A identity_access worker -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=identity_access.settings.development
      - DATABASE_NAME=fva_identity
      - DATABASE_USER=app_user
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-devpassword}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat (Periodic Tasks)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fva-identity-celery-beat
    command: celery -A identity_access beat -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=identity_access.settings.development
      - DATABASE_NAME=fva_identity
      - DATABASE_USER=app_user
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-devpassword}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
