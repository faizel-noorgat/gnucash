[project]
name = "accounting-engine"
version = "1.0.0"
description = "Core accounting engine for FVA Accounting Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "django-filter>=24.3,<25.0",
    "psycopg[binary]>=3.2,<3.3",
    "redis>=5.0,<5.1",
    "celery>=5.4,<5.5",
    "django-celery-beat>=2.7,<2.8",
    "django-celery-results>=2.5,<2.6",
    "python-dotenv>=1.0,<1.1",
    "pydantic>=2.9,<2.10",
    "pydantic-settings>=2.5,<2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-django>=4.9,<4.10",
    "pytest-cov>=5.0,<5.1",
    "pytest-xdist>=3.6,<3.7",
    "factory-boy>=3.3,<3.4",
    "faker>=28.0,<29.0",
    "black>=24.8,<24.9",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<1.12",
    "django-stubs>=5.1,<5.2",
    "djangorestframework-stubs>=3.15,<3.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "accounting_engine.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=accounting_engine",
    "--cov-report=term-missing",
    "-v",
]
markers = [
    "acceptance: Acceptance tests for behavior contract rules",
    "golden: Golden accounting tests",
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.django-stubs]
django_settings_module = "accounting_engine.settings"
