[tool.poetry]
name = "document-intelligence"
version = "0.1.0"
description = "Document Intelligence bounded context for FVA Accounting Platform"
authors = ["FVA Accounting <dev@fva.sg>"]
readme = "README.md"
packages = [{include = "document_intelligence"}]

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.0"
djangorestframework = "^3.14"
psycopg = {version = "^3.1", extras = ["binary"]}
celery = {version = "^5.3", extras = ["redis"]}
redis = "^5.0"
django-filter = "^23.5"
boto3 = "^1.34"
python-dotenv = "^1.0"
# OCR providers (pluggable; v1 picks one)
boto3-textract-stub = {version = "^0.1", optional = true}
# Hashing / integrity
hashlib-additional = {version = "^0.1", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-django = "^4.7"
pytest-cov = "^4.1"
factory-boy = "^3.3"
faker = "^22.0"
black = "^23.12"
ruff = "^0.1.9"
mypy = "^1.8"
moto = {version = "^5.0", extras = ["s3"]}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "document_intelligence.settings.test"
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "acceptance: behavior-contract acceptance tests (tagged with rule ID)",
    "slow: marks tests as slow",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
