[project]
name = "gnucash-reimagined"
version = "0.1.0"
description = "Modern multi-tenant cloud accounting SaaS platform"
requires-python = ">=3.11"
dependencies = [
    # Django core
    "Django>=5.0,<6.0",
    "django-filter>=24.0",

    # Django REST Framework
    "djangorestframework>=3.15,<4.0",
    "drf-spectacular>=0.27.0",

    # Database
    "psycopg[binary]>=3.1,<4.0",

    # Authentication
    "djangorestframework-simplejwt>=5.3,<6.0",
    "django-otp>=1.3,<2.0",

    # Async tasks
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0",

    # Storage
    "django-storages[s3]>=1.14,<2.0",
    "boto3>=1.34,<2.0",

    # Utilities
    "python-decouple>=3.8,<4.0",
    "django-environ>=0.11,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",

    # Date/time handling
    "python-dateutil>=2.8,<3.0",

    # Decimal precision
    "decimal-converter>=0.2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0,<9.0",
    "pytest-django>=4.7,<5.0",
    "pytest-cov>=4.1,<5.0",
    "pytest-xdist>=3.5,<4.0",
    "factory-boy>=3.3,<4.0",
    "faker>=22.0,<23.0",

    # Code quality
    "ruff>=0.2.0",
    "black>=24.0,<25.0",
    "isort>=5.13,<6.0",
    "mypy>=1.8,<2.0",
    "django-stubs>=4.2,<5.0",
    "djangorestframework-stubs>=3.14,<4.0",

    # Development
    "django-debug-toolbar>=4.2,<5.0",
    "ipython>=8.20,<9.0",
    "django-extensions>=3.2,<4.0",
]

ocr = [
    # OCR services (choose one)
    # "aws-textract>=0.1.0",
    # "google-cloud-documentai>=2.0.0",
]

ai = [
    # AI/LLM services
    # "openai>=1.0.0",
    # "anthropic>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps", "common"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "golden: marks tests as golden accounting tests",
    "rls: marks tests as RLS-specific tests",
]

[tool.coverage.run]
source = ["config", "apps", "common"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["config", "apps", "common", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "S",  # flake8-bandit
    "A",  # flake8-builtins
    "C4", # flake8-comprehensions
    "DTZ",# flake8-datetimez
    "T20",# flake8-print
    "RET",# flake8-return
    "SIM",# flake8-simplify
]
ignore = [
    "S101", # Use of assert detected (ok in tests)
    "B008", # Do not perform function calls in argument defaults (ok for Django)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps", "common"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["config", "apps", "common"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.django-stubs]
django_settings_module = "config.settings.development"
