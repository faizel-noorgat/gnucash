# Docker Compose configuration for GnuCash Reimagined
# Development environment with PostgreSQL, Redis, and application services
#
# Two database roles are in play. The application runs as `app_user`, which the
# RLS policies bind; migrations run as `postgres`, which owns the tables and is
# the only role that can write across tenants (FORCE ROW LEVEL SECURITY binds
# the owner too). See README.md, "Runtime and deploy database roles".
#
# ONE-TIME STEP, after the first `docker compose up`: `app_user` is created by
# migration 0001 with NOLOGIN, because a provisioning migration must never
# invent a credential.
#
#   docker compose exec db psql -U postgres -d gnucash_dev \
#     -c "ALTER ROLE app_user LOGIN PASSWORD 'app_user'"
#
# Until that runs, `web` and the Celery services cannot connect. It survives
# `docker compose restart`, later `migrate` runs and test runs; it is needed
# once per cluster.

version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gnucash_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery task queue and caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django application
  web:
    build:
      context: .
      target: development
    command: >
      sh -c "python manage.py migrate --database=deploy &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_NAME=gnucash_dev
      - DB_USER=app_user
      - DB_PASSWORD=app_user
      - DB_HOST=db
      - DB_PORT=5432
      - DB_OWNER_USER=postgres
      - DB_OWNER_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker for background tasks
  celery_worker:
    build:
      context: .
      target: development
    command: celery -A config.celery worker -l INFO
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_NAME=gnucash_dev
      - DB_USER=app_user
      - DB_PASSWORD=app_user
      - DB_HOST=db
      - DB_PORT=5432
      - DB_OWNER_USER=postgres
      - DB_OWNER_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery beat for scheduled tasks
  celery_beat:
    build:
      context: .
      target: development
    command: celery -A config.celery beat -l INFO
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_NAME=gnucash_dev
      - DB_USER=app_user
      - DB_PASSWORD=app_user
      - DB_HOST=db
      - DB_PORT=5432
      - DB_OWNER_USER=postgres
      - DB_OWNER_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
